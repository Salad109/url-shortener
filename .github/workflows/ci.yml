name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Build & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go build ./...
      - run: go test -race ./...
      - run: go mod tidy -diff
      - run: go mod verify

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.13.1

  vuln:
    name: Vulnerabilities
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: golang/govulncheck-action@v1
        with:
          go-version-file: go.mod

  generated:
    name: Generated code is current
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: sqlc-dev/setup-sqlc@v5
        with:
          sqlc-version: '1.31.1'
      - run: sqlc diff

  smoke:
    name: Stack boots and redirects
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Write .env
        run: |
          cp .env.example .env
          sed -i 's/^POSTGRES_PASSWORD=$/POSTGRES_PASSWORD=ci-not-a-secret/' .env
      - run: docker compose up -d --build --wait
      - name: Shorten a /health URL and follow it
        run: |
          created=$(curl -sS -X POST http://localhost:8080/create \
            -H 'Content-Type: application/json' \
            -d '{"original_url":"http://localhost:8080/health"}')
          echo "$created"
          code=$(echo "$created" | jq -re .short_code)
          curl -sS -L "http://localhost:8080/$code" | jq -e '.status == "ok"'
      - name: App logs
        if: failure()
        run: docker compose logs app
