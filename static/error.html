<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta content="width=device-width, initial-scale=1" name="viewport">
    <title>Something went wrong</title>
    <link href="/static/app.css" rel="stylesheet">
</head>
<body>
<main class="sheet">
    <p class="eyebrow">Server error</p>
    <h1>Something went wrong</h1>
    <p class="lede">The link could not be looked up. Try again in a moment.</p>

    <div class="rule"></div>

    <article class="stub">
        <div class="stub__grip"></div>
        <div class="stub__body">
            <p class="stub__label">Requested</p>
            <p class="stub__code" id="code">this link</p>
        </div>
        <span class="stamp">Error</span>
    </article>

    <a class="back" href="/">Back to the shortener</a>
</main>

<script>
    const path = decodeURIComponent(location.pathname).slice(1, 40);
    if (path) document.getElementById("code").textContent = `${location.host}/${path}`;
</script>
</body>
</html>
